# Builds the site on pushes to main and on pull requests, and deploys it to GitHub Pages
# (https://thundernerd.github.io/Portfolio/) on pushes to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A new commit on a pull request supersedes its older build;
# runs on main queue instead, so a deployment in progress is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs dependencies, runs the checks below, and uploads dist/ as the
      # `github-pages` artifact.
      - name: Check, build and upload site
        uses: withastro/action@v6
        # Raises the GitHub API rate limit for the prebuild stats fetch (scripts/fetch-github.mjs).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          build-cmd: npm run check && npm test && npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
